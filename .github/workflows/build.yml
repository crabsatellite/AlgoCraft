name: Build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    # Full-bank compilation and judging can exceed one hour on bounded runners.
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check public source hygiene
        run: python scripts/check_public_tree.py

      - name: Validate loader update feed
        run: python scripts/validate_update_json.py

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./mod-build.ps1 build --no-daemon

      - name: Upload build test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-test-reports
          path: |
            build/reports/tests/
            build/test-results/
            run/logs/
            run/crash-reports/
          retention-days: 14

  ide-client-acceptance:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check public source hygiene
        run: python scripts/check_public_tree.py

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Mesa software OpenGL for hosted native tests
        id: mesa
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-mesa

      - name: Scope Mesa to the disposable runner JDK
        env:
          MESA_ROOT: ${{ steps.mesa.outputs.msys2-location }}
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'Mesa deployment is only allowed on disposable GitHub-hosted runners'
          }
          $mesaBin = Join-Path $env:MESA_ROOT 'ucrt64/bin'
          $jdkBin = Join-Path $env:JAVA_HOME 'bin'
          foreach ($name in @('opengl32.dll', 'libgallium_wgl.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $mesaBin $name))) {
              throw "Missing Mesa driver: $name"
            }
          }
          Get-ChildItem -LiteralPath $mesaBin -Filter '*.dll' | Copy-Item -Destination $jdkBin
          "GALLIUM_DRIVER=llvmpipe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LP_NUM_THREADS=2" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # JVM and full-bank coverage run in the build job; this independent job
      # runs the same ten-pass native gate without repeating the JVM suite.
      - name: Run IDE client smoke and stress tests
        env:
          # Exercise the real OpenAL mixer without a physical audio device.
          ALSOFT_DRIVERS: 'null'
        run: ./mod-build.ps1 gradle ideStressTest --no-daemon '-PalgocraftTestRuntimeDirectory=run-ide-stress'

      - name: Upload IDE client acceptance artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ide-client-acceptance
          path: |
            build/algocraft-ide-smoke/
            build/algocraft-ide-stress/
            run-ide-smoke/logs/
            run-ide-smoke/crash-reports/
            run-ide-stress/logs/
            run-ide-stress/crash-reports/
          retention-days: 14
