name: Build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    # Full-bank compilation and judging can exceed one hour on bounded runners.
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check public source hygiene
        run: python scripts/check_public_tree.py

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./mod-build.ps1 build --no-daemon

  ide-client-acceptance:
    runs-on: windows-latest
    needs: build
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check public source hygiene
        run: python scripts/check_public_tree.py

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run IDE client smoke and stress tests
        run: ./mod-build.ps1 gradle ideClientAcceptanceTest --no-daemon '-PalgocraftTestRuntimeDirectory=run-ide-stress'

      - name: Upload IDE client acceptance artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ide-client-acceptance
          path: |
            build/algocraft-ide-smoke/
            build/algocraft-ide-stress/
            run-ide-smoke/logs/
            run-ide-smoke/crash-reports/
            run-ide-stress/logs/
            run-ide-stress/crash-reports/
          retention-days: 14
