name: Solution Tests

on:
  push:
    paths:
      - 'question_bank/official/**'
      - 'src/test/java/com/crabmods/algocraft/testengine/**'
  pull_request:
    paths:
      - 'question_bank/official/**'
      - 'src/test/java/com/crabmods/algocraft/testengine/**'
  workflow_dispatch:

jobs:
  test-solutions:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Solution Tests
        run: ./gradlew test --tests "com.crabmods.algocraft.testengine.SolutionTestSuite" --no-build-cache
        continue-on-error: true

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: build/test-results/test/TEST-*.xml
          check_name: 'Solution Test Results'
          comment_mode: 'off'

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 14
