name: Solution Tests

on:
  push:
    paths:
      - 'question_bank/official/**'
      - 'src/test/java/com/crabmods/algocraft/testengine/**'
  pull_request:
    paths:
      - 'question_bank/official/**'
      - 'src/test/java/com/crabmods/algocraft/testengine/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-solutions:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check public source hygiene
        run: python scripts/check_public_tree.py

      - name: Validate loader update feed
        run: python scripts/validate_update_json.py

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Official Question Bank Tests
        run: ./mod-build.ps1 gradle officialQuestionBankTest --no-build-cache --no-daemon

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: |
            build/reports/tests/officialQuestionBankTest*/
            build/test-results/officialQuestionBankTest*/TEST-*.xml
          retention-days: 14
