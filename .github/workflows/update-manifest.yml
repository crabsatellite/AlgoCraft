name: Validate Question Bank Manifest
on:
  push:
    paths: ['question_bank/official/**']
  pull_request:
    paths: ['question_bank/official/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate bank JSON
        working-directory: question_bank/official
        run: python generate_manifest.py --validate-only
