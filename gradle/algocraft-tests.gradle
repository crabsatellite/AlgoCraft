import java.lang.management.ManagementFactory

abstract class AlgoCraftTestLeaseParameters implements
        org.gradle.api.services.BuildServiceParameters {
    abstract org.gradle.api.file.RegularFileProperty getLockFile()
    abstract org.gradle.api.file.RegularFileProperty getProcessGuard()
    abstract org.gradle.api.provider.Property<String> getPathMarker()
}

abstract class AlgoCraftTestLeaseService implements
        org.gradle.api.services.BuildService<AlgoCraftTestLeaseParameters>,
        AutoCloseable {
    private java.nio.channels.FileChannel channel
    private java.nio.channels.FileLock lock

    private void assertNoExistingRuntime() {
        def currentPid = ManagementFactory.runtimeMXBean.name.split('@')[0]
        def command = ['pwsh', '-NoProfile', '-File',
                       parameters.processGuard.get().asFile.absolutePath,
                       '-FailIfDetected', '-ExcludeProcessIdsCsv', currentPid,
                       '-IncludePathMarkersCsv', parameters.pathMarker.get()]
        def process = new ProcessBuilder(command).redirectErrorStream(true).start()
        def output = process.inputStream.getText('UTF-8').trim()
        def exitCode = process.waitFor()
        if (exitCode != 0) {
            throw new GradleException(
                    "Minecraft runtime-resource preflight failed (${exitCode}): ${output}")
        }
    }

    synchronized void acquire() {
        if (lock != null) {
            return
        }
        def path = parameters.lockFile.get().asFile.toPath()
        try {
            java.nio.file.Files.createDirectories(path.parent)
            channel = java.nio.channels.FileChannel.open(
                    path,
                    java.nio.file.StandardOpenOption.CREATE,
                    java.nio.file.StandardOpenOption.WRITE)
            lock = channel.tryLock()
            if (lock == null) {
                throw new GradleException(
                        'another Minecraft runtime holds this runtime-directory lease')
            }
            assertNoExistingRuntime()
        } catch (Exception error) {
            releaseAll()
            throw new GradleException(
                    'cannot acquire the Minecraft runtime-directory lease',
                    error)
        }
    }

    private void releaseAll() {
        if (lock != null) {
            lock.release()
            lock = null
        }
        if (channel != null) {
            channel.close()
            channel = null
        }
    }

    @Override
    synchronized void close() { releaseAll() }
}

def algocraftTestRuntimeDirectory = providers.gradleProperty(
        'algocraftTestRuntimeDirectory').map { value ->
    project.file(value.toString()).canonicalFile
}.orElse(layout.projectDirectory.asFile)
def algocraftTestRuntimeHash = algocraftTestRuntimeDirectory.map { runtimeDir ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    digest.digest(runtimeDir.absolutePath.toLowerCase(java.util.Locale.ROOT)
            .getBytes(java.nio.charset.StandardCharsets.UTF_8))
            .collect { value -> String.format('%02x', value & 0xff) }
            .join('').toString()
}
def algocraftTestRuntimeLockPath = algocraftTestRuntimeHash.map { hash ->
    ('algocraft-tests/runtime-' + hash.toString() + '.lock').toString()
}

def algocraftTestLeaseService = gradle.sharedServices.registerIfAbsent(
        'algocraftTestRuntimeLeaseService',
        AlgoCraftTestLeaseService) {
    parameters.lockFile.set(
            layout.file(providers.provider {
                new File(System.getProperty('java.io.tmpdir'),
                        algocraftTestRuntimeLockPath.get())
            }))
    parameters.processGuard.set(
            layout.projectDirectory.file(
                    'scripts/runtime_process_guard.ps1'))
    parameters.pathMarker.set(algocraftTestRuntimeDirectory.map { runtimeDir ->
        runtimeDir.absolutePath.toString()
    })
    maxParallelUsages.set(1)
}
def algocraftTestRuntimeLease = tasks.register(
        'algocraftTestRuntimeLease') {
    group = 'verification'
    description = 'Hold the declared runtime-directory lease until this Gradle build finishes.'
    usesService algocraftTestLeaseService
    doLast {
        algocraftTestLeaseService.get().acquire()
    }
}

def algocraftTestPreflight = tasks.register('algocraftTestPreflight', Exec) {
    group = 'verification'
    workingDir project.projectDir
    commandLine 'python', file('scripts/verify_test_environment.py').absolutePath
}

tasks.configureEach { candidate ->
    boolean runtimeGuarded = candidate.name.startsWith('runClient')
            || candidate.name.startsWith('runServer')
            || candidate.name.startsWith('runGameTestServer')
            || candidate.name.startsWith('runData')
            || candidate.name in ['runIdeClientSmokeTest', 'runIdeClientStressTest', 'runBankClientA', 'runBankClientB', 'runBankServer']
    if (runtimeGuarded) {
        candidate.dependsOn algocraftTestPreflight
        candidate.dependsOn algocraftTestRuntimeLease
        candidate.usesService algocraftTestLeaseService
    }
}
